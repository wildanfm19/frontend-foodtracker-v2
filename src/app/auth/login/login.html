<div class="container-fluid">
  <div class="row no-gutter">
    <!-- The image half -->
    <div class="col-md-6 d-none d-md-flex bg-image"></div>

    <!-- The content half -->
    <div class="col-md-6 bg-light">
      <div class="login d-flex align-items-center py-5">
        <!-- FoodTracker Login -->
        <div class="container">
          <div class="row">
            <div class="col-lg-10 col-xl-7 mx-auto">
              <h3 class="display-4 text-success bold">
                <strong>Food Tracker </strong>
              </h3>
              <p class="text-muted mb-4">
                Track Erlin's meals, calories, and stay healthy every day.
              </p>
              <form #loginForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
                <!-- Error Message -->
                @if (errorMessage) {
                <div class="alert alert-danger rounded-pill text-center mb-3">
                  <i class="bi bi-exclamation-circle me-2"></i>
                  {{ errorMessage }}
                </div>
                }

                <!-- Email -->
                <div class="form-group mb-3">
                  <input
                    [(ngModel)]="loginRequest.email"
                    name="email"
                    id="inputEmail"
                    type="email"
                    placeholder="Email address"
                    required
                    (input)="clearErrorMessage()"
                    class="form-control rounded-pill border-0 shadow-sm px-4"
                  />

                  @if (loginForm.submitted && !loginRequest.email) {
                  <div class="text-danger small">Email is required</div>
                  }
                </div>

                <!-- Password -->
                <div class="form-group mb-3">
                  <input
                    [(ngModel)]="loginRequest.password"
                    name="password"
                    id="inputPassword"
                    type="password"
                    placeholder="Password"
                    required
                    minlength="6"
                    (input)="clearErrorMessage()"
                    class="form-control rounded-pill border-0 shadow-sm px-4 text-primary"
                  />

                  @if (loginForm.submitted && !loginRequest.password) {
                  <div class="text-danger small">Password is required</div>
                  }
                </div>

                <!-- Submit -->
                <div class="text-center">
                  <button
                    type="submit"
                    class="btn btn-success mb-2 rounded-pill shadow-sm px-5"
                    [disabled]="loginForm.invalid || isLoading"
                  >
                    @if (isLoading) {
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Signing in...
                    } @else {
                    Sign in
                    }
                  </button>
                </div>

                <!-- Extra links -->
                <div class="text-center mt-3">
                  <p
                    (click)="onClickRegister()"
                    class="small text-primary cursor-pointer"
                  >
                    Create an account
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- End -->
      </div>
    </div>
    <!-- End -->
  </div>
</div>

<style>
  .bg-image {
    background-image: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
    background-size: cover;
    background-position: center;
  }
</style>
