<div class="meal-card-wrapper">
  <div class="card meal-card h-100 shadow-sm">
    <div class="card-header meal-header text-white text-center"
         [style.background]="'linear-gradient(135deg, ' + getMealTypeColor(mealType) + ', ' + getMealTypeColor(mealType) + '90)'">
      <div class="meal-header-content">
        <div class="meal-icon-wrapper">
          <i [class]="getMealTypeIcon(mealType)" class="meal-main-icon"></i>
        </div>
        <h4 class="meal-title mb-2">{{ mealType }}</h4>
        <div class="meal-stats">
          <div class="stat-badge">
            <i class="bi bi-collection me-1"></i>
            {{ foods.length }} items
          </div>
          <div class="stat-badge">
            <i class="bi bi-clock me-1"></i>
            Today
          </div>
        </div>
      </div>
    </div>

    <div class="card-body">
      <!-- Empty State -->
      <div *ngIf="foods.length === 0" class="empty-state text-center">
        <div class="empty-illustration">
          <i class="bi bi-bowl empty-icon mb-3"></i>
        </div>
        <h5 class="empty-title">Ready for {{ mealType.toLowerCase() }}?</h5>
        <p class="empty-subtitle">Start logging your meals to track your nutrition journey</p>
        <button class="empty-cta-button" (click)="onAddMeal()">
          <span class="cta-text">Add your first meal</span>
          <div class="cta-indicator">
            <i class="bi bi-plus-circle-fill"></i>
          </div>
        </button>
      </div>

      <!-- Food Items -->
      <div class="food-items" *ngIf="foods.length > 0">
        <div class="food-item" *ngFor="let food of foods; trackBy: trackByMealId; let i = index" [style.animation-delay]="(i * 100) + 'ms'">
          <div class="food-content">
            <div class="food-main">
              <div class="food-icon-wrapper">
                <i class="bi bi-egg-fried food-emoji"></i>
              </div>
              <div class="food-info">
                <div class="food-name-wrapper">
                  <h5 class="food-name">{{ food.food }}</h5>
                  <div class="food-badge">Fresh</div>
                </div>
                <p class="food-description">{{ food.description }}</p>
                <div class="food-meta">
                  <div class="food-timestamp">
                    <i class="bi bi-clock-history"></i>
                    <span>{{ formatTime(food.time) }}</span>
                  </div>
                  <div class="food-date">
                    <i class="bi bi-calendar-event"></i>
                    <span>{{ formatDate(food.date) }}</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="food-actions">
              <button
                class="btn delete-btn"
                (click)="onDeleteFood(food)"
                title="Remove this meal"
                type="button">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
